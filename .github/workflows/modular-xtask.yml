name: Modular xtask

# Release-gating checks for the `modular-xtask` crate (sdk/crates/modular-xtask),
# the build/test driver for modular Trezor apps (invoked as `xtask modular <cmd>`,
# and consumed as a path dependency by core/embed/xtask). These must all pass
# before a release of the crate is cut. See sdk/doc/development.md for
# background on the crate's role.

on:
  pull_request:
    paths:
      - 'sdk/crates/modular-xtask/**'
      - '.github/workflows/modular-xtask.yml'
  workflow_dispatch:
  schedule:
    - cron: '19 23 * * *'  # every day @ 23:19
  push:
    branches:
      - 'release/**'
      - 'secfix/**'
    paths:
      - 'sdk/crates/modular-xtask/**'

# cancel any previous runs on the same PR
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  modular_xtask_fmt_check:
    name: Format check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # actions/checkout@v6.0.2
        with:
          submodules: recursive
      - uses: ./.github/actions/environment
      - run: nix-shell --run "make modular_xtask_fmt_check"

  modular_xtask_check:
    name: Cargo check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # actions/checkout@v6.0.2
        with:
          submodules: recursive
      - uses: ./.github/actions/environment
      - run: nix-shell --run "make modular_xtask_check"

  modular_xtask_clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # actions/checkout@v6.0.2
        with:
          submodules: recursive
      - uses: ./.github/actions/environment
      - run: nix-shell --run "make modular_xtask_clippy"

  modular_xtask_unit_tests:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # actions/checkout@v6.0.2
        with:
          submodules: recursive
      - uses: ./.github/actions/environment
      - run: nix-shell --run "make modular_xtask_test"

  modular_xtask_doc_tests:
    name: Doc tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # actions/checkout@v6.0.2
        with:
          submodules: recursive
      - uses: ./.github/actions/environment
      - run: nix-shell --run "make modular_xtask_doctest"

  modular_xtask_doc_build:
    name: Doc build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # actions/checkout@v6.0.2
        with:
          submodules: recursive
      - uses: ./.github/actions/environment
      - run: nix-shell --run "make modular_xtask_doc"

  modular_xtask_deps_check:
    name: Dependency check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # actions/checkout@v6.0.2
        with:
          submodules: recursive
      - uses: ./.github/actions/environment
      - run: nix-shell --run "make modular_xtask_audit"
      - run: nix-shell --run "make modular_xtask_vet"
